[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-stateless-by-design"
version = "0.1.0"
description = "A reproducible lab for MCP protocol state and multi-worker coordination."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "mcp>=2.0.0,<3",
    "uvicorn>=0.35,<1",
]

[dependency-groups]
dev = [
    "pyright[nodejs]>=1.1.403,<2",
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.1,<2",
    "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_stateless"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "-p", "no:cacheprovider"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
